services:
  # ---------- PERFIL DE PRODUCCIÓN ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alhabla_backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TELNYX_DEMO_ASSISTANT_ID: ${TELNYX_DEMO_ASSISTANT_ID}
      TELNYX_DEMO_PELUQUERIA_ASSISTANT_ID: ${TELNYX_DEMO_PELUQUERIA_ASSISTANT_ID}
      TELNYX_DEMO_CENTRO_ESTETICA_ASSISTANT_ID: ${TELNYX_DEMO_CENTRO_ESTETICA_ASSISTANT_ID}
      TELNYX_DEMO_SALON_UNAS_ASSISTANT_ID: ${TELNYX_DEMO_SALON_UNAS_ASSISTANT_ID}
      TELNYX_DEMO_BARBERIA_ASSISTANT_ID: ${TELNYX_DEMO_BARBERIA_ASSISTANT_ID}
      TELNYX_DEMO_FISIOTERAPIA_ASSISTANT_ID: ${TELNYX_DEMO_FISIOTERAPIA_ASSISTANT_ID}
      TELNYX_DEMO_MAX_DURATION_SECONDS: ${TELNYX_DEMO_MAX_DURATION_SECONDS:-60}
      BASE_URL: ${BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      FIRST_USER_BOOTSTRAP_SECRET: ${FIRST_USER_BOOTSTRAP_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_INICIO: ${STRIPE_PRICE_INICIO}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO}
      STRIPE_PRICE_SCALE: ${STRIPE_PRICE_SCALE}
      STRIPE_PRICE_INICIO_FOUNDER: ${STRIPE_PRICE_INICIO_FOUNDER}
      STRIPE_PRICE_PRO_FOUNDER: ${STRIPE_PRICE_PRO_FOUNDER}
      STRIPE_PRICE_SCALE_FOUNDER: ${STRIPE_PRICE_SCALE_FOUNDER}
      STRIPE_PRICES_ANTERIORES_INICIO: ${STRIPE_PRICES_ANTERIORES_INICIO:-}
      STRIPE_PRICES_ANTERIORES_PRO: ${STRIPE_PRICES_ANTERIORES_PRO:-}
      STRIPE_PRICES_ANTERIORES_SCALE: ${STRIPE_PRICES_ANTERIORES_SCALE:-}
      STRIPE_PRICE_EXTRA_INICIO: ${STRIPE_PRICE_EXTRA_INICIO}
      STRIPE_PRICE_EXTRA_PRO: ${STRIPE_PRICE_EXTRA_PRO}
      STRIPE_PRICE_EXTRA_SCALE: ${STRIPE_PRICE_EXTRA_SCALE}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      GOOGLE_AUTH_CLIENT_ID: ${GOOGLE_AUTH_CLIENT_ID}
      GOOGLE_AUTH_CLIENT_SECRET: ${GOOGLE_AUTH_CLIENT_SECRET}
      GOOGLE_AUTH_REDIRECT_URI: ${GOOGLE_AUTH_REDIRECT_URI}
      FACEBOOK_LOGIN_APP_ID: ${FACEBOOK_LOGIN_APP_ID}
      FACEBOOK_LOGIN_APP_SECRET: ${FACEBOOK_LOGIN_APP_SECRET}
      FACEBOOK_LOGIN_REDIRECT_URI: ${FACEBOOK_LOGIN_REDIRECT_URI}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      CALENDAR_CREDENTIALS_KEY: ${CALENDAR_CREDENTIALS_KEY}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      APP_URL: ${APP_URL}
      WEB_URL: ${WEB_URL}
      EXTRA_ALLOWED_ORIGIN: ${EXTRA_ALLOWED_ORIGIN}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_REGION: ${R2_REGION}
      R2_ENDPOINT: ${R2_ENDPOINT}
      PHONE_NUMBER_COUNTRY: ${PHONE_NUMBER_COUNTRY}
      TELNYX_API_KEY: ${TELNYX_API_KEY}
      TELNYX_SPAIN_REQUIREMENT_GROUP_ID: ${TELNYX_SPAIN_REQUIREMENT_GROUP_ID}
      TELNYX_SPAIN_LOCALITY: ${TELNYX_SPAIN_LOCALITY}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID}
      ZOHO_DEV_ALLOWED_RECIPIENTS: ${ZOHO_DEV_ALLOWED_RECIPIENTS}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET}
      ZOHO_REFRESH_TOKEN: ${ZOHO_REFRESH_TOKEN}
      ZOHO_ACCOUNT_ID: ${ZOHO_ACCOUNT_ID}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GCP_REGION: ${GCP_REGION}
      INTERNAL_JOBS_BASE_URL: ${INTERNAL_JOBS_BASE_URL}
      CLOUD_TASKS_INVOKER_SERVICE_ACCOUNT: ${CLOUD_TASKS_INVOKER_SERVICE_ACCOUNT}
      TELNYX_PUBLIC_KEY: ${TELNYX_PUBLIC_KEY}
      ENVIOS_SIMULADOS: ${ENVIOS_SIMULADOS:-}
      TELNYX_CALL_CONTROL_APP_ID: ${TELNYX_CALL_CONTROL_APP_ID}
      TELNYX_ALERT_EMAIL: ${TELNYX_ALERT_EMAIL}
      TELNYX_SMS_SENDER_ID: ${TELNYX_SMS_SENDER_ID}
      TELNYX_MESSAGING_PROFILE_ID: ${TELNYX_MESSAGING_PROFILE_ID}
      WHATSAPP_TELNYX_FROM_NUMBER: ${WHATSAPP_TELNYX_FROM_NUMBER}
      WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID}
      TELNYX_CLIENT_CHAT_ENABLED: ${TELNYX_CLIENT_CHAT_ENABLED:-false}
      TELNYX_OWNER_CHAT_ENABLED: ${TELNYX_OWNER_CHAT_ENABLED:-false}
      TELNYX_GESTOR_ASSISTANT_ID: ${TELNYX_GESTOR_ASSISTANT_ID}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-es}
      WHATSAPP_TEMPLATE_CONFIRMATION_NAME: ${WHATSAPP_TEMPLATE_CONFIRMATION_NAME}
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS}
      CALL_TEXT_RETENTION_DAYS: ${CALL_TEXT_RETENTION_DAYS}
      WHATSAPP_TEMPLATE_REMINDER_NAME: ${WHATSAPP_TEMPLATE_REMINDER_NAME}
      WHATSAPP_TEMPLATE_SLOT_AVAILABLE_NAME: ${WHATSAPP_TEMPLATE_SLOT_AVAILABLE_NAME}
      TELNYX_INSIGHT_CALL_OUTCOME_ID: ${TELNYX_INSIGHT_CALL_OUTCOME_ID}
      TELNYX_INSIGHT_ESCALATION_REASON_ID: ${TELNYX_INSIGHT_ESCALATION_REASON_ID}
      TELNYX_INSIGHT_TOOL_FAILURE_ID: ${TELNYX_INSIGHT_TOOL_FAILURE_ID}
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOST: 0.0.0.0
    ports:
      - "3000:3000"
      - "5555:5555"
    restart: unless-stopped
    # Este perfil se activa con: docker compose --profile prod up
    profiles:
      - prod

  # ---------- PERFIL DE DESARROLLO ----------
  # Túnel con nombre de Cloudflare: expone backend-dev en un hostname FIJO
  # (https://dev-api.alhabla.ai). Sustituye a ngrok, cuyo plan gratuito rotaba
  # el hostname en cada reinicio y dejaba los webhooks ya registrados en Telnyx
  # y Retell apuntando al túnel anterior, fallando en silencio. El token lleva
  # dentro a qué túnel se conecta y su enrutado; el hostname se configura una
  # vez en Cloudflare (ver AGENTS.md § Local development).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: alhabla_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend-dev
    profiles:
      - dev

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alhabla_backend_dev
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TELNYX_DEMO_ASSISTANT_ID: ${TELNYX_DEMO_ASSISTANT_ID}
      TELNYX_DEMO_PELUQUERIA_ASSISTANT_ID: ${TELNYX_DEMO_PELUQUERIA_ASSISTANT_ID}
      TELNYX_DEMO_CENTRO_ESTETICA_ASSISTANT_ID: ${TELNYX_DEMO_CENTRO_ESTETICA_ASSISTANT_ID}
      TELNYX_DEMO_SALON_UNAS_ASSISTANT_ID: ${TELNYX_DEMO_SALON_UNAS_ASSISTANT_ID}
      TELNYX_DEMO_BARBERIA_ASSISTANT_ID: ${TELNYX_DEMO_BARBERIA_ASSISTANT_ID}
      TELNYX_DEMO_FISIOTERAPIA_ASSISTANT_ID: ${TELNYX_DEMO_FISIOTERAPIA_ASSISTANT_ID}
      TELNYX_DEMO_MAX_DURATION_SECONDS: ${TELNYX_DEMO_MAX_DURATION_SECONDS:-60}
      BASE_URL: ${BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      FIRST_USER_BOOTSTRAP_SECRET: ${FIRST_USER_BOOTSTRAP_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_INICIO: ${STRIPE_PRICE_INICIO}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO}
      STRIPE_PRICE_SCALE: ${STRIPE_PRICE_SCALE}
      STRIPE_PRICE_INICIO_FOUNDER: ${STRIPE_PRICE_INICIO_FOUNDER}
      STRIPE_PRICE_PRO_FOUNDER: ${STRIPE_PRICE_PRO_FOUNDER}
      STRIPE_PRICE_SCALE_FOUNDER: ${STRIPE_PRICE_SCALE_FOUNDER}
      STRIPE_PRICES_ANTERIORES_INICIO: ${STRIPE_PRICES_ANTERIORES_INICIO:-}
      STRIPE_PRICES_ANTERIORES_PRO: ${STRIPE_PRICES_ANTERIORES_PRO:-}
      STRIPE_PRICES_ANTERIORES_SCALE: ${STRIPE_PRICES_ANTERIORES_SCALE:-}
      STRIPE_PRICE_EXTRA_INICIO: ${STRIPE_PRICE_EXTRA_INICIO}
      STRIPE_PRICE_EXTRA_PRO: ${STRIPE_PRICE_EXTRA_PRO}
      STRIPE_PRICE_EXTRA_SCALE: ${STRIPE_PRICE_EXTRA_SCALE}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      GOOGLE_AUTH_CLIENT_ID: ${GOOGLE_AUTH_CLIENT_ID}
      GOOGLE_AUTH_CLIENT_SECRET: ${GOOGLE_AUTH_CLIENT_SECRET}
      GOOGLE_AUTH_REDIRECT_URI: ${GOOGLE_AUTH_REDIRECT_URI}
      FACEBOOK_LOGIN_APP_ID: ${FACEBOOK_LOGIN_APP_ID}
      FACEBOOK_LOGIN_APP_SECRET: ${FACEBOOK_LOGIN_APP_SECRET}
      FACEBOOK_LOGIN_REDIRECT_URI: ${FACEBOOK_LOGIN_REDIRECT_URI}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      CALENDAR_CREDENTIALS_KEY: ${CALENDAR_CREDENTIALS_KEY}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      APP_URL: ${APP_URL}
      WEB_URL: ${WEB_URL}
      EXTRA_ALLOWED_ORIGIN: ${EXTRA_ALLOWED_ORIGIN}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_REGION: ${R2_REGION}
      R2_ENDPOINT: ${R2_ENDPOINT}
      PHONE_NUMBER_COUNTRY: ${PHONE_NUMBER_COUNTRY}
      TELNYX_API_KEY: ${TELNYX_API_KEY}
      TELNYX_SPAIN_REQUIREMENT_GROUP_ID: ${TELNYX_SPAIN_REQUIREMENT_GROUP_ID}
      TELNYX_SPAIN_LOCALITY: ${TELNYX_SPAIN_LOCALITY}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID}
      ZOHO_DEV_ALLOWED_RECIPIENTS: ${ZOHO_DEV_ALLOWED_RECIPIENTS}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET}
      ZOHO_REFRESH_TOKEN: ${ZOHO_REFRESH_TOKEN}
      ZOHO_ACCOUNT_ID: ${ZOHO_ACCOUNT_ID}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GCP_REGION: ${GCP_REGION}
      INTERNAL_JOBS_BASE_URL: ${INTERNAL_JOBS_BASE_URL}
      CLOUD_TASKS_INVOKER_SERVICE_ACCOUNT: ${CLOUD_TASKS_INVOKER_SERVICE_ACCOUNT}
      TELNYX_PUBLIC_KEY: ${TELNYX_PUBLIC_KEY}
      ENVIOS_SIMULADOS: ${ENVIOS_SIMULADOS:-}
      TELNYX_CALL_CONTROL_APP_ID: ${TELNYX_CALL_CONTROL_APP_ID}
      TELNYX_ALERT_EMAIL: ${TELNYX_ALERT_EMAIL}
      TELNYX_SMS_SENDER_ID: ${TELNYX_SMS_SENDER_ID}
      TELNYX_MESSAGING_PROFILE_ID: ${TELNYX_MESSAGING_PROFILE_ID}
      WHATSAPP_TELNYX_FROM_NUMBER: ${WHATSAPP_TELNYX_FROM_NUMBER}
      WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID}
      TELNYX_CLIENT_CHAT_ENABLED: ${TELNYX_CLIENT_CHAT_ENABLED:-false}
      TELNYX_OWNER_CHAT_ENABLED: ${TELNYX_OWNER_CHAT_ENABLED:-false}
      TELNYX_GESTOR_ASSISTANT_ID: ${TELNYX_GESTOR_ASSISTANT_ID}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-es}
      WHATSAPP_TEMPLATE_CONFIRMATION_NAME: ${WHATSAPP_TEMPLATE_CONFIRMATION_NAME}
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS}
      CALL_TEXT_RETENTION_DAYS: ${CALL_TEXT_RETENTION_DAYS}
      WHATSAPP_TEMPLATE_REMINDER_NAME: ${WHATSAPP_TEMPLATE_REMINDER_NAME}
      WHATSAPP_TEMPLATE_SLOT_AVAILABLE_NAME: ${WHATSAPP_TEMPLATE_SLOT_AVAILABLE_NAME}
      TELNYX_INSIGHT_CALL_OUTCOME_ID: ${TELNYX_INSIGHT_CALL_OUTCOME_ID}
      TELNYX_INSIGHT_ESCALATION_REASON_ID: ${TELNYX_INSIGHT_ESCALATION_REASON_ID}
      TELNYX_INSIGHT_TOOL_FAILURE_ID: ${TELNYX_INSIGHT_TOOL_FAILURE_ID}
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      HOST: 0.0.0.0
    ports:
      - "3000:3000"
      - "5555:5555"
    # En desarrollo: usamos tsx watch sobre el código fuente
    command: sh -c "npx prisma generate && npm run dev"
    volumes:
      - ./backend:/app
      - /app/node_modules   # Previene conflictos con node_modules del host
    restart: unless-stopped
    profiles:
      - dev

  # ---------- BACKEND DE SIMULACIÓN (perfil sim) ----------
  # El mismo backend de dev, con la misma BD, pero confiando en una clave
  # Ed25519 generada en local en vez de en la de Telnyx: es el destino de los
  # webhooks de Telnyx firmados por el MCP de desarrollo (backend/mcp/). El
  # backend de dev (:3000) sigue aceptando solo los de Telnyx, así que las
  # llamadas reales contra dev no cambian. Con ENVIOS_SIMULADOS no manda
  # WhatsApp, SMS ni correos. Se levanta con
  # scripts/backend-sim.sh (también desde un worktree).
  backend-sim:
    extends:
      service: backend-dev
    container_name: alhabla_backend_sim
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TELNYX_PUBLIC_KEY: ${TELNYX_PUBLIC_KEY_SIMULACION}
      # Los WhatsApp, SMS y correos de las tools simuladas no salen
      # (src/lib/enviosSimulados.ts); las citas sí van al calendario.
      ENVIOS_SIMULADOS: "1"
    ports: !override
      - "3010:3000"
    profiles: !override
      - sim

  # ---------- POSTGRES ----------
  postgres:
    image: postgres:15-alpine
    container_name: alhabla_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alhabla
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
