name: CI

# Gate de calidad: corre en cada PR y en cada push a main, para backend,
# frontend (la app), web (la web pública), growth (el dashboard interno de
# Alhabla Growth) y el Worker de Cloudflare de los
# bloqueos de LaLiga (infra/cloudflare/failover-laliga) por separado. No
# despliega nada —
# eso lo hace deploy-backend.yml (solo backend; la app, la web y growth se
# despliegan solas vía la integración Git de Vercel). Ver AGENTS.md §
# Deployment Notes para el resto del pipeline.
#
# Por zonas (desde el 2026-11-06): el job «Qué cambia» mira qué carpetas toca
# el cambio (.github/scripts/zonas-del-ci.sh, el mismo que usa
# scripts/comprobar-rama.sh en local) y cada job solo corre si le toca. Antes
# un artículo del blog pasaba también los 5 minutos del backend. Un job que se
# salta por su `if` cuenta como aprobado en los checks obligatorios de main,
# así que estos siguen siendo los mismos cuatro. Si «Qué cambia» falla, se
# corre todo (`needs.cambios.result != 'success'`).

on:
  pull_request:
    # labeled/unlabeled: poner o quitar la etiqueta `migracion-contract`
    # vuelve a lanzar el job «diff», que la lee del evento. Relanzar la
    # ejecución anterior no sirve: reutiliza el evento original, sin la
    # etiqueta. El resto de jobs no depende de las etiquetas y se salta.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

# Un push nuevo a un PR cancela la ejecución anterior de ese PR (ya no sirve).
# Las de etiquetas van aparte: si no, poner `migracion-contract` cancelaría el
# CI de verdad y los checks obligatorios se quedarían en «cancelado». En main
# no se cancela nada: cada merge tiene su ejecución.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'etiquetas' || 'codigo' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cambios:
    name: Qué cambia
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.zonas.outputs.backend }}
      conocimiento: ${{ steps.zonas.outputs.conocimiento }}
      frontend: ${{ steps.zonas.outputs.frontend }}
      web: ${{ steps.zonas.outputs.web }}
      growth: ${{ steps.zonas.outputs.growth }}
      laliga: ${{ steps.zonas.outputs.laliga }}
      copias: ${{ steps.zonas.outputs.copias }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # En un PR, lo que el PR cambia respecto a su base; en un push a main,
      # lo que trae el push (sin `before`, en el primer push, todo).
      - id: zonas
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/zonas-del-ci.sh "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"

  backend:
    name: Backend — typecheck, lint, test
    needs: cambios
    # La base de conocimiento de Growth vive en backend/ pero lee PRODUCT.md,
    # el blog y parte de web/src/lib: un cambio solo ahí pasa la comprobación
    # del conocimiento y los tests que leen el repo real, no la suite entera.
    if: >-
      !cancelled() && github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
      (needs.cambios.result != 'success' || needs.cambios.outputs.backend == 'true' || needs.cambios.outputs.conocimiento == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPLETO: ${{ needs.cambios.result != 'success' || needs.cambios.outputs.backend == 'true' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - if: env.COMPLETO == 'true'
        run: npm run typecheck
      - if: env.COMPLETO == 'true'
        run: npm run lint
      - if: env.COMPLETO == 'true'
        run: npm run test
      - name: Solo los tests que leen el repo (no cambia backend/)
        if: env.COMPLETO != 'true'
        run: npm run test:conocimiento
      - run: npm run growth:conocimiento -- --comprobar

  integration:
    name: Backend — tests de integración
    needs: cambios
    if: >-
      !cancelled() && github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
      (needs.cambios.result != 'success' || needs.cambios.outputs.backend == 'true' || needs.cambios.outputs.conocimiento == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alhabla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alhabla_test
      JWT_SECRET: ci-tests-de-integracion-sin-valor-real
      NODE_ENV: test
      COMPLETO: ${{ needs.cambios.result != 'success' || needs.cambios.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma migrate deploy

      - if: env.COMPLETO == 'true'
        run: npm run test:integration
      - name: Solo los de Growth, que leen el repo (no cambia backend/)
        if: env.COMPLETO != 'true'
        run: npm run test:integration:conocimiento

  diff:
    name: Cambios — migraciones y orden de despliegue
    # Solo en PR: son avisos para quien revisa. En un push a main ya es tarde.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # cloudbuild-migraciones.yaml aplica las migraciones ANTES de cambiar el tráfico, así
      # que durante el despliegue conviven el esquema nuevo y la revisión
      # antigua. Quitar o renombrar una columna en el mismo deploy que el
      # código que deja de usarla rompe esa revisión mientras dura el cambio:
      # hay que hacerlo en DOS deploys (dejar de usarla → borrarla). Esa regla
      # vivía solo en la cabeza de quien la aprendió con los calendarios.
      - name: Migraciones destructivas sin confirmar
        env:
          ETIQUETAS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          BASE="origin/${{ github.base_ref }}"
          NUEVAS=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'backend/prisma/migrations/**/migration.sql' || true)
          if [ -z "$NUEVAS" ]; then
            echo "El PR no añade ni cambia migraciones."
            exit 0
          fi
          echo "Migraciones en este PR:"
          echo "$NUEVAS" | sed 's/^/  /'

          HALLAZGOS="$RUNNER_TEMP/migraciones-peligrosas.txt"
          : > "$HALLAZGOS"
          PATRON='DROP[[:space:]]+(COLUMN|TABLE)|RENAME[[:space:]]+(COLUMN|TO)|SET[[:space:]]+NOT[[:space:]]+NULL'
          for f in $NUEVAS; do
            grep -niE "$PATRON" "$f" | sed "s|^|  $f:|" >> "$HALLAZGOS" || true
          done

          if [ ! -s "$HALLAZGOS" ]; then
            echo "Ninguna sentencia destructiva."
            exit 0
          fi

          echo "Sentencias que rompen la revisión antigua durante el despliegue:"
          cat "$HALLAZGOS"

          # Dos formas de confirmar que es deliberado y que la fase previa ya
          # está desplegada: la etiqueta del PR, o un commit que lo diga.
          if echo ",$ETIQUETAS," | grep -q ',migracion-contract,'; then
            echo "::notice::Confirmado con la etiqueta 'migracion-contract'."
            exit 0
          fi
          if git log --format=%B "$BASE"..HEAD | grep -qiF 'contract-migration: ok'; then
            echo "::notice::Confirmado con 'contract-migration: ok' en un commit."
            exit 0
          fi

          echo "::error::Esta migración rompe la revisión antigua mientras dura el despliegue (deploy-backend.yml aplica las migraciones antes de cambiar el tráfico). Si el código que usaba esas columnas YA está desplegado, confírmalo con la etiqueta 'migracion-contract' en el PR o con la línea 'contract-migration: ok' en un commit. Si no, pártelo en dos deploys."
          exit 1

      # No bloquea: el riesgo real es bajo y ocasional, pero conviene recordar
      # el orden. Vercel publica la app (frontend/), la web (web/) y growth (growth/) en cuanto
      # se fusiona, mientras que el backend pasa por build, migraciones y
      # despliegue de revisión.
      - name: Aviso si el PR toca frontend/web y backend a la vez
        run: |
          BASE="origin/${{ github.base_ref }}"
          CAMBIOS=$(git diff --name-only "$BASE"...HEAD)
          TOCA_FRONT=$(echo "$CAMBIOS" | grep -cE '^(frontend|web|growth)/' || true)
          TOCA_BACK=$(echo "$CAMBIOS" | grep -c '^backend/' || true)
          if [ "$TOCA_FRONT" -gt 0 ] && [ "$TOCA_BACK" -gt 0 ]; then
            echo "::warning::Este PR toca frontend/web/growth ($TOCA_FRONT ficheros) y backend ($TOCA_BACK). Vercel publica la app, la web y growth en cuanto se fusiona y el backend tarda varios minutos: si el frontend depende de algo nuevo del backend, habrá una ventana en la que falle. Si es el caso, fusiona antes el backend."
          else
            echo "El PR no mezcla frontend y backend."
          fi

  worker-laliga:
    name: Infra — Worker de LaLiga
    needs: cambios
    if: >-
      !cancelled() && github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
      (needs.cambios.result != 'success' || needs.cambios.outputs.laliga == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # El Worker que apaga y enciende el proxy de Cloudflare en los bloqueos de
    # LaLiga. No tiene dependencias: sus tests van con el runner de Node. Este
    # job no lo despliega; se sube a mano (README de la carpeta).
    defaults:
      run:
        working-directory: infra/cloudflare/failover-laliga
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: node --test

  copias-compartidas:
    name: Copias compartidas app/web
    needs: cambios
    if: >-
      !cancelled() && github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
      (needs.cambios.result != 'success' || needs.cambios.outputs.copias == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # La app y la web son dos proyectos de Vercel con root propio, así que un
    # componente que usan las dos vive copiado en las dos, sin paquete común.
    # google-analytics.tsx acabó con dos versiones distintas porque nada lo
    # comprobaba. La lista de ficheros vive en el script.
    steps:
      - uses: actions/checkout@v7

      - run: bash scripts/comprobar-copias-compartidas.sh

  frontend:
    name: Frontend — lint, test, build
    needs: cambios
    if: >-
      !cancelled() && github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
      (needs.cambios.result != 'success' || needs.cambios.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # La versión de Node vive en .nvmrc, la misma que la imagen de
          # producción (backend/Dockerfile) y que `engines` en cada package.json.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # La caché de compilación de Next (la receta de su documentación): con
      # el mismo lock, recompila solo lo que cambia.
      - uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: next-frontend-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: next-frontend-${{ hashFiles('frontend/package-lock.json') }}-

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # No hay script `typecheck` en frontend/package.json — `next build`
      # tipa como parte de la compilación (ver AGENTS.md).
      #
      # NEXT_PUBLIC_API_BASE_URL es obligatoria desde 2026-09-17: sin ella el
      # bundle salía apuntando a un rewrite hacia localhost y la aplicación se
      # publicaba muda (pasó dos veces en producción), así que lib/api.ts
      # ahora lanza en build. No es un secreto — es la URL pública del backend
      # — y Vercel ya la tiene configurada en su propio build, que es el que
      # de verdad protege el despliegue.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.alhabla.ai
          NEXT_PUBLIC_WEB_URL: https://alhabla.ai

  web:
    name: Web — lint, test, build
    needs: cambios
    if: >-
      !cancelled() && github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
      (needs.cambios.result != 'success' || needs.cambios.outputs.web == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/cache@v6
        with:
          path: web/.next/cache
          key: next-web-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/src/**', 'web/content/**') }}
          restore-keys: next-web-${{ hashFiles('web/package-lock.json') }}-

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # La web de marketing (docs/historico/PLAN-APP-DOMINIO.md): mismas reglas
      # que el
      # frontend. NEXT_PUBLIC_APP_URL es a dónde enlaza «Entrar» y a dónde
      # salta el registro con el pase.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.alhabla.ai
          NEXT_PUBLIC_SITE_URL: https://alhabla.ai
          NEXT_PUBLIC_APP_URL: https://app.alhabla.ai
      # Ningún par de páginas del sitemap puede compartir la mitad del texto
      # principal: Google agrupa las casi iguales y solo indexa una (las 30
      # páginas sector × ciudad, 2026-10-20). Lee el HTML del build anterior.
      - run: npm run seo:similitud

  growth:
    name: Growth — lint, test, build
    needs: cambios
    if: >-
      !cancelled() && github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
      (needs.cambios.result != 'success' || needs.cambios.outputs.growth == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: growth
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: growth/package-lock.json

      - uses: actions/cache@v6
        with:
          path: growth/.next/cache
          key: next-growth-${{ hashFiles('growth/package-lock.json') }}-${{ hashFiles('growth/src/**') }}
          restore-keys: next-growth-${{ hashFiles('growth/package-lock.json') }}-

      - run: npm ci
      - run: npm run lint
      # Incluye las pruebas de paridad con backend/src/modules/growth/ (el
      # checkout trae el repo entero, así que los ficheros están; por eso esa
      # carpeta también activa este job).
      - run: npm run test
      # El dashboard interno de Alhabla Growth (PLAN-GROWTH.md § 8). Sin
      # NEXT_PUBLIC_GROWTH_DEMO: con ella el build de producción FALLA a
      # propósito (src/lib/config.ts). El ID de cliente de Google de abajo es
      # un relleno, no un secreto: solo hace falta para que el build no se
      # niegue; el de verdad lo tiene el proyecto de Vercel.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.alhabla.ai
          NEXT_PUBLIC_GROWTH_GOOGLE_CLIENT_ID: ci-sin-valor-real.apps.googleusercontent.com
      # El modo demostración pone una sesión falsa y datos inventados en un
      # panel que aprueba contactos externos. Sus datos de prueba llevan una
      # sentinela (growth/src/lib/demo/datos.ts): si aparece en el build, la
      # demostración se ha colado y el job falla.
      - name: La demostración no está en el build
        run: |
          if grep -rl DEMO_ALHABLA_GROWTH_SENTINELA .next/static .next/server; then
            echo "::error::La sentinela del modo demostración está en el build de producción (ficheros arriba). La condición de src/lib/crear-cliente.ts o de src/components/puerta-de-sesion.tsx ya no la elimina."
            exit 1
          fi
          echo "La sentinela de la demostración no aparece en .next/static ni en .next/server."
