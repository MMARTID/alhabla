# La imagen de alhabla-api, y nada más: no toca producción. Las migraciones van
# en cloudbuild-migraciones.yaml, que deploy-backend.yml lanza cuando han
# pasado los tests; así la imagen se construye a la vez que los tests.
#
# Con caché de capas (desde el 2026-11-06). Antes cada build reinstalaba las
# dependencias de cero, dos veces (etapas deps y runtime del Dockerfile): 3 min
# 20 s de los 5 min 36 s del build. buildx guarda TODAS las capas de todas las
# etapas (mode=max) en alhabla/backend-cache:buildx; con el mismo
# package-lock.json, los `npm ci` salen de la caché y solo se recompila src/.
# La política de limpieza de Artifact Registry (prefijo «backend», más de 7
# días) la mantiene pequeña; si se borra, el siguiente build la rehace.
#
# Sin atestaciones (--provenance/--sbom=false): con ellas buildx publica un
# índice OCI con un manifiesto de atestación aparte, que la política de
# «conservar las 10 más recientes» cuenta como otra versión, y la imagen deja
# de ser la de siempre. Con oci-mediatypes=false sale el mismo tipo que antes
# de buildx (un manifiesto Docker v2 de una sola plataforma); la caché sí va en
# OCI, que es lo que Artifact Registry pide para los manifiestos de caché.
#
# buildkit va en su propio contenedor (driver docker-container, el único que
# exporta caché a un registro) y tira de Docker Hub por mirror.gcr.io, el
# espejo de Google, para no depender del límite de descargas anónimas.
substitutions:
  # Override con --substitutions=_TAG=<sha> desde CI para que cada deploy
  # tenga una imagen propia y sin ambigüedad si dos builds se solapan; los
  # builds manuales (sin pasar _TAG) siguen publicando :latest como siempre.
  _TAG: latest
  _IMAGEN: europe-west1-docker.pkg.dev/project-84381467-a606-4b71-a6e/alhabla/backend
  _CACHE: europe-west1-docker.pkg.dev/project-84381467-a606-4b71-a6e/alhabla/backend-cache:buildx
steps:
  # La etapa `runtime` del Dockerfile multi-stage: sin --target construiría la
  # última, `development`.
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        printf '[registry."docker.io"]\n  mirrors = ["mirror.gcr.io"]\n' > /tmp/buildkitd.toml
        docker buildx create --name alhabla --driver docker-container \
          --driver-opt image=mirror.gcr.io/moby/buildkit:buildx-stable-1 \
          --config /tmp/buildkitd.toml --use
        docker buildx build \
          --target=runtime \
          --cache-from "type=registry,ref=${_CACHE}" \
          --cache-to "type=registry,ref=${_CACHE},mode=max,image-manifest=true,oci-mediatypes=true" \
          --provenance=false \
          --sbom=false \
          --tag "${_IMAGEN}:${_TAG}" \
          --output "type=registry,oci-mediatypes=false" \
          .
